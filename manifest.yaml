  # ─────────── MiniMax H3 (Hailuo 3.0): 2K video WITH native audio ───────────
  #
  # Reference-driven video: up to 9 reference images / 3 ref videos / 3 ref
  # audios, tagged in the prompt as <Picture 1>, <Video 1>, <Audio 1>.
  # Needs ComfyUI >= 0.30.0 (native support; no custom node on this path).
  #
  # SIZE WARNING: the pruned INT8 set is ~42.5 GB for one transformer + encoder
  # + VAEs, ~63 GB with both transformers. Everything is tagged `minimax-h3`
  # so the wizard can offer it as a single opt-in, and `optional` so
  # `--required-only` skips it.
  #
  # LICENSE: MiniMax H3 Community License Agreement — NOT MIT, unlike MiniMax's
  # earlier releases. Recorded into licenses.json by the downloader.
  #
  # VRAM: 42.5 GB minimum footprint. Fine on 48GB+ (and workable on 24-32GB via
  # ComfyUI's dynamic offload, slowly). Deliberately NOT on local-12gb — a 12GB
  # card cannot run this in any usable way, even quantized.

